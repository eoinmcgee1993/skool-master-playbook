name: Handoff to playbook engine

on:
  workflow_dispatch:
  push:
    paths:
      - "data/normalised/bundle.json"

permissions:
  contents: read

jobs:
  handoff:
    if: github.event_name == 'workflow_dispatch' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sync authorised bundle and trigger engine
        env:
          GH_TOKEN: ${{ secrets.PLAYBOOK_ENGINE_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          B64=$(base64 -w 0 data/normalised/bundle.json)
          SHA=$(gh api repos/eoinmcgee1993/skool-playbook-engine/contents/input/bundle.json --jq .sha 2>/dev/null || true)
          if [ -n "$SHA" ]; then
            gh api --method PUT repos/eoinmcgee1993/skool-playbook-engine/contents/input/bundle.json               -f message="automation: update authorised source bundle"               -f content="$B64"               -f branch="main"               -f sha="$SHA"
          else
            gh api --method PUT repos/eoinmcgee1993/skool-playbook-engine/contents/input/bundle.json               -f message="automation: add authorised source bundle"               -f content="$B64"               -f branch="main"
          fi
          gh api --method POST repos/eoinmcgee1993/skool-playbook-engine/dispatches             -f event_type="source-bundle-updated"
