name: Normalise authorised material

on:
  push:
    paths:
      - "data/inbox/**"
      - "scripts/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  normalise:
    if: github.event_name == 'workflow_dispatch' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/normalise.py
      - name: Commit normalised bundle
        run: |
          git config user.name "skool-playbook-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/normalised/bundle.json
          git diff --cached --quiet || git commit -m "automation: update normalised source bundle"
          git push
